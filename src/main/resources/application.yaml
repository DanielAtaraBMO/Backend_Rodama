spring:
  application:
    name: ecommerce

  datasource:
    url: jdbc:mysql://localhost:3306/rodama?useSSL=false&serverTimezone=UTC
    username: root
    password: Admin123*

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE