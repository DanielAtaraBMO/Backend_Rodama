server:
  port: 8080

spring:
  application:
    name: ecommerce

  datasource:
    url: jdbc:mysql://localhost:3306/rodama?useSSL=false&serverTimezone=UTC
    username: root
    password: Admin123*
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

# 🔐 CONFIG JWT (IMPORTANTE)
jwt:
  secret: my_super_secret_key_rodama_2026_1234567890123456
  expiration: 86400000 # 24 horas en milisegundos

# 🌐 CORS (para conectar con frontend React)
app:
  cors:
    allowed-origins: http://localhost:5173,http://localhost:3000

# 📊 LOGS (útil para debug)
logging:
  level:
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE